# Node image = v1.35.8, the version the CKA/CKS exams run (as of 2026-10). kind v0.33.0
# requires the @sha256 digest. Same image for every node.
#
# kind cluster with the default CNI (kindnet) disabled, so Calico can be
# installed and NetworkPolicy is actually enforced (kindnet ignores it).
#
#   kind create cluster --name cka --config kind/calico.yaml
#
# Nodes stay NotReady until a CNI is installed -- that's expected (and is the
# Q8 scenario). Install Calico next; see the training doc.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
  # Calico's default IP pool; matching it avoids editing the Calico manifest.
  podSubnet: 192.168.0.0/16
nodes:
  - role: control-plane
    image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
  - role: worker
    image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
