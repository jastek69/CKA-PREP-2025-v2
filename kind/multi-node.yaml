# Node image = v1.35.8, the version the CKA/CKS exams run (as of 2026-10). kind v0.33.0
# requires the @sha256 digest. Same image for every node.
#
# kind cluster with 1 control plane + 2 workers, for scheduling labs
# (Q10 taints/tolerations, nodeSelector, affinity, drain/cordon).
#
#   kind create cluster --name cka --config kind/multi-node.yaml
#
# Uses the default CNI (kindnet): fine for scheduling, but NetworkPolicy is
# NOT enforced here -- use kind/calico.yaml for that.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
  - role: worker
    image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
  - role: worker
    image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
